*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #0e0e0e;
  --white: #faf9f7;
  --rose: #F656BF;
  --rose-dark: #d63da5;
  --rose-rgb: 246,86,191;
  --lila: #AEBFF2;
  --lila-rgb: 174,191,242;
  --muted: rgba(250,249,247,.35);
  --very-muted: rgba(250,249,247,.12);
}

html, body {
  height: 100%;
  background: var(--ink);
  color: var(--white);
  cursor: none;
  overflow: hidden;
}

/* CURSOR */
#cur {
  position: fixed;
  width: 7px; height: 7px;
  background: var(--rose);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: width .25s, height .25s;
}
#cur-r {
  position: fixed;
  width: 32px; height: 32px;
  border: 1px solid var(--lila);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  opacity: .35;
  transition: width .3s, height .3s, opacity .3s;
}

/* GRID */
#grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(var(--lila-rgb),.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(var(--lila-rgb),.04) 1px, transparent 1px);
  background-size: 52px 52px;
  pointer-events: none;
  z-index: 0;
}

/* CORNERS */
.corner {
  position: fixed;
  font-family: 'Nunito Sans', sans-serif;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: .22em;
  color: var(--very-muted);
  text-transform: uppercase;
  z-index: 10;
  opacity: 0;
  transition: opacity 1s;
}
.corner.tl { top: 28px; left: 36px; }
.corner.tr { top: 28px; right: 36px; text-align: right; }
.corner.bl { bottom: 28px; left: 36px; }
.corner.br { bottom: 28px; right: 36px; text-align: right; }

/* BRAND LOGO */
.brand-logo {
  position: fixed;
  bottom: 24px;
  right: 36px;
  width: 150px;
  height: auto;
  z-index: 10;
  filter: brightness(0) invert(1);
  opacity: 0;
  transition: opacity 1s;
}

/* GLOBITOS — portfolio flotante */
#globitos {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  overflow: hidden;
}
.globito {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: auto;
  cursor: none;
  text-decoration: none;
  will-change: transform, opacity;
  opacity: 0;
  transition: opacity .7s ease, box-shadow .25s;
  color: inherit;
}
.globito.show {
  opacity: 1;
}
.globito:hover,
.globito:focus-visible {
  z-index: 2;
}
.globito-wrap {
  position: relative;
  display: block;
  width: 100%;
}
.globito-body {
  display: block;
  position: relative;
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1;
  flex-shrink: 0;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--g-color, var(--lila));
  box-shadow: 0 4px 24px rgba(0,0,0,.35);
  transition: box-shadow .25s, border-color .25s;
  background: var(--g-bg, transparent);
  max-width: 100%;
  margin: 0 auto;
}
.globito-body--svg {
  border: none;
  background: transparent;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
}
.globito:hover .globito-body,
.globito:focus-visible .globito-body {
  box-shadow: 0 0 32px color-mix(in srgb, var(--g-color, var(--rose)) 50%, transparent);
}
.globito-cover {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 42%;
  transform-origin: center center;
}
.globito-body--svg .globito-cover {
  object-fit: cover;
  object-position: center 40%;
  transform: scale(1.14);
}
.globito-caption {
  display: block;
  margin-top: 10px;
  font-family: 'Nunito Sans', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: none;
  color: rgba(250,249,247,.42);
  text-align: center;
  white-space: normal;
  line-height: 1.35;
  max-width: 92px;
  margin-left: auto;
  margin-right: auto;
  overflow-wrap: break-word;
  word-break: break-word;
  pointer-events: none;
}

/* PORTFOLIO MÓVIL — carrusel horizontal debajo del mail */
.portfolio-mobile {
  display: none;
  width: 100%;
  margin-top: 36px;
  opacity: 0;
  transition: opacity .7s;
}
.portfolio-mobile.show {
  opacity: 1;
}
.portfolio-mobile-label {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: rgba(250,249,247,.25);
  text-align: center;
  margin-bottom: 12px;
}
.portfolio-mobile-track {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding: 2px 4px 10px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.portfolio-mobile-track::-webkit-scrollbar {
  display: none;
}
.portfolio-mobile-item {
  flex: 0 0 auto;
  scroll-snap-align: start;
  text-decoration: none;
  color: inherit;
  cursor: none;
  text-align: center;
  width: 88px;
  opacity: 1;
}
.portfolio-mobile-item .globito-body {
  margin: 0 auto;
}
.portfolio-mobile-item .globito-caption {
  max-width: 88px;
  font-size: 9px;
  letter-spacing: .06em;
  line-height: 1.4;
}

/* MAIN */
main {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: safe center;
  z-index: 5;
  padding: 40px 24px;
  overflow-y: auto;
  pointer-events: none;
}
main > * { flex-shrink: 0; pointer-events: auto; }

.eyebrow {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: .35em;
  color: var(--rose);
  text-transform: uppercase;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transition: opacity .8s;
}
.eyebrow::before, .eyebrow::after {
  content: '';
  width: 20px; height: 1px;
  background: var(--rose);
  opacity: .6;
}

.headline {
  font-family: 'Egyptian Slate', serif;
  font-weight: 700;
  font-size: clamp(32px, 5.5vw, 72px);
  line-height: 1.02;
  letter-spacing: -.02em;
  text-align: center;
  color: var(--white);
  max-width: 800px;
  min-height: 80px;
}

.cursor-blink {
  display: inline-block;
  width: 3px;
  height: .9em;
  background: var(--rose);
  vertical-align: middle;
  margin-left: 3px;
  animation: blink .85s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.subline {
  font-family: 'Egyptian Slate', serif;
  font-weight: 400;
  font-style: italic;
  font-size: clamp(15px, 1.8vw, 20px);
  color: var(--muted);
  text-align: center;
  max-width: 480px;
  line-height: 1.55;
  margin-top: 28px;
  opacity: 0;
  transition: opacity .7s;
}

/* FORM */
.form-wrap {
  margin-top: 34px;
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  opacity: 0;
  transition: opacity .7s;
}
.form-label {
  font-family: 'Nunito Sans', sans-serif;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: .2em;
  color: rgba(250,249,247,.25);
  text-transform: uppercase;
  margin-bottom: 12px;
  align-self: flex-start;
  display: flex;
  align-items: center;
  gap: 7px;
}
.label-icon {
  width: 22px;
  height: 22px;
  opacity: .8;
}
.form-error {
  align-self: flex-start;
  margin-top: 10px;
  min-height: 12px;
  font-family: 'Nunito Sans', sans-serif;
  font-size: 10px;
  letter-spacing: .04em;
  color: var(--rose);
  opacity: 0;
  transition: opacity .25s;
}
.form-error.show { opacity: .85; }
.form-row {
  display: flex;
  width: 100%;
}
.form-input {
  flex: 1;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(var(--rose-rgb),.25);
  border-right: none;
  outline: none;
  padding: 15px 18px;
  font-family: 'Egyptian Slate', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 16px;
  color: var(--white);
  transition: border-color .25s;
  -webkit-appearance: none;
}
.form-input::placeholder { color: rgba(250,249,247,.2); }
.form-input:focus { border-color: rgba(var(--rose-rgb),.7); }
.form-btn {
  background: var(--rose);
  border: 1px solid var(--rose);
  padding: 15px 26px;
  font-family: 'Nunito Sans', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .2em;
  color: var(--white);
  cursor: none;
  text-transform: uppercase;
  transition: background .2s;
  white-space: nowrap;
}
.form-btn:hover { background: var(--rose-dark); border-color: var(--rose-dark); }

/* CHAT GAME — TERMINAL */
.chat-wrap {
  width: 100%;
  margin-bottom: 22px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 14px;
}
.terminal {
  width: 100%;
  border: 1px solid rgba(var(--lila-rgb), .22);
  border-radius: 10px;
  background: rgba(255,255,255,.02);
  overflow: hidden;
  font-family: ui-monospace, 'SFMono-Regular', 'Consolas', monospace;
}
.term-bar {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px 14px;
  border-bottom: 1px solid rgba(var(--lila-rgb), .12);
  background: rgba(255,255,255,.015);
}
.term-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.term-dot.d1 { background: var(--rose); }
.term-dot.d2 { background: #FAF26F; }
.term-dot.d3 { background: #ABE3D2; }
.term-title {
  margin-left: 8px;
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: rgba(250,249,247,.4);
}
.term-body {
  position: relative;
  padding: 16px 16px 18px;
  font-size: 12px;
  line-height: 1.05;
}
.chat-wink {
  position: absolute;
  right: 14px;
  bottom: 12px;
  width: 30px;
  height: 30px;
  opacity: 0;
  transform: scale(.4) rotate(-12deg);
  transition: opacity .3s, transform .35s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
}
.chat-wink.show {
  opacity: .9;
  transform: scale(1) rotate(0);
}
.term-head {
  color: rgba(250,249,247,.35);
  margin-bottom: 14px;
  letter-spacing: .02em;
}
.bars {
  display: grid;
  grid-template-columns: max-content auto max-content;
  align-items: center;
  gap: 9px 12px;
}
.bar-label {
  color: rgba(250,249,247,.55);
  white-space: nowrap;
}
.bar-label .tick { color: var(--rose); }
.bar {
  letter-spacing: 2px;
  white-space: nowrap;
}
.bar .fill { color: var(--bar-color); }
.bar .track { color: rgba(250,249,247,.16); }
.pct {
  color: rgba(250,249,247,.35);
  white-space: nowrap;
}
.term-resp {
  margin-top: 16px;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
}
.term-resp.idle { display: none; }
.term-resp:not(.idle) {
  position: relative;
  display: inline-block;
  max-width: 86%;
  background: #e1adff;
  color: #1e0c39;
  padding: 10px 14px 11px;
  border-radius: 13px 13px 13px 3px;
}
.term-resp:not(.idle)::before {
  content: '';
  position: absolute;
  left: 8px;
  bottom: -7px;
  width: 0; height: 0;
  border: 7px solid transparent;
  border-top-color: #e1adff;
  border-bottom: 0;
}
.term-resp::after {
  content: '▋';
  color: #1e0c39;
  animation: blink .85s step-end infinite;
  margin-left: 1px;
}
.term-resp.idle::after { content: ''; }

.chat-q {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.chat-btn {
  background: rgba(var(--lila-rgb), .04);
  border: 1px solid rgba(var(--lila-rgb), .3);
  border-radius: 100px;
  padding: 8px 14px;
  font-family: 'Nunito Sans', sans-serif;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: .04em;
  color: rgba(250,249,247,.55);
  cursor: none;
  transition: border-color .2s, color .2s, background .2s;
}
.chat-btn:hover {
  border-color: rgba(var(--rose-rgb), .7);
  color: var(--white);
  background: rgba(var(--rose-rgb), .06);
}

/* SUCCESS — DINO */
.dino-success {
  display: none;
  margin-top: 44px;
  align-items: flex-end;
  gap: 6px;
}
.dino-success.show { display: flex; }
.dino-wrap {
  flex-shrink: 0;
  animation: dino-bob 2.6s ease-in-out infinite;
}
.dino {
  width: 86px;
  height: 86px;
  display: block;
  animation: dino-pop .55s cubic-bezier(.34,1.56,.64,1) both;
}
.speech {
  position: relative;
  background: #6882eb;
  color: #fff;
  font-family: 'Egyptian Slate', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 15px;
  line-height: 1.4;
  padding: 14px 18px;
  border-radius: 16px;
  max-width: 230px;
  margin-bottom: 20px;
  opacity: 0;
  transform: translateY(6px) scale(.96);
  animation: speech-in .4s ease .4s both;
}
.speech::after {
  content: '';
  position: absolute;
  left: -8px;
  bottom: 14px;
  width: 0; height: 0;
  border: 8px solid transparent;
  border-right-color: #6882eb;
  border-left: 0;
}
.speech .caret {
  display: inline-block;
  width: 2px;
  height: 1em;
  background: #fff;
  vertical-align: -2px;
  margin-left: 2px;
  animation: blink .85s step-end infinite;
}
@keyframes dino-pop {
  0% { transform: translateY(22px) scale(.5); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes speech-in {
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes dino-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* CLOCK */
#clock {
  font-family: 'Nunito Sans', monospace;
  font-size: 9px;
  letter-spacing: .15em;
  color: rgba(var(--lila-rgb), .8);
}

/* MOBILE */
@media (max-width: 600px) {
  .corner.tr, .corner.br { display: none; }
  .corner.tl { font-size: 8px; left: 20px; top: 20px; }
  .corner.bl { font-size: 8px; left: 20px; bottom: 20px; max-width: 55%; }
  .eyebrow { font-size: 8px; }
  .form-wrap { max-width: 100%; }
  .brand-logo { width: 96px; right: 20px; bottom: 18px; }
  .term-body { font-size: 10px; padding: 13px 12px 15px; }
  .bar { letter-spacing: 0; }
  .term-resp { font-size: 11px; }
  .chat-btn { font-size: 9px; padding: 7px 11px; }
  .globito-caption { font-size: 9px; margin-top: 8px; }
  #globitos { display: none !important; }
  .portfolio-mobile { display: block; }
  main { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 100px; }
}
</style>
</head>
<body>

<div id="cur"></div>
<div id="cur-r"></div>
<div id="grid"></div>
<div id="globitos" aria-label="Proyectos"></div>

<div class="corner tr" id="c-tr"><span id="clock">——:——:——</span></div>
<div class="corner bl" id="c-bl">sistemas a medida · córdoba, arg</div>

<img class="brand-logo" id="brand-logo" src="assets/logo-horizontal.svg" alt="Ailen Sampó" />

<main>
  <div class="eyebrow" id="eyebrow">algo está tomando forma</div>

  <div class="headline" id="headline">
    <span class="cursor-blink"></span>
  </div>

  <div class="subline" id="subline">
    No es magia. Es arquitectura digital.
  </div>

  <div class="form-wrap" id="form-wrap">
    <div class="chat-wrap">
      <div class="terminal">
        <div class="term-bar">
          <span class="term-dot d1"></span>
          <span class="term-dot d2"></span>
          <span class="term-dot d3"></span>
          <span class="term-title">estado del proyecto</span>
        </div>
        <div class="term-body">
          <div class="term-head">&gt; estado del proyecto</div>
          <div class="bars">
            <span class="bar-label">[<span class="tick">▪</span>] café:</span>
            <span class="bar" id="bar-cafe" style="--bar-color: var(--rose);"></span>
            <span class="pct" id="pct-cafe"></span>

            <span class="bar-label">[<span class="tick">▪</span>] código:</span>
            <span class="bar" id="bar-codigo" style="--bar-color: var(--lila);"></span>
            <span class="pct" id="pct-codigo"></span>

            <span class="bar-label">[ ] paciencia de la dev:</span>
            <span class="bar" id="bar-paciencia" style="--bar-color: rgba(250,249,247,.5);"></span>
            <span class="pct" id="pct-paciencia"></span>

const MOBILE_GLOBITO_MAX = 600;

function isMobileGlobitos() {
  return window.innerWidth <= MOBILE_GLOBITO_MAX;
}

function buildGlobitoBody(p, size) {
  const isSvg = p.image.endsWith('.svg');
  const bodyClass = 'globito-body' + (isSvg ? ' globito-body--svg' : '');
  const coverPos = p.coverPos || (isSvg ? 'center 40%' : 'center center');
  let imgStyle = 'object-position:' + coverPos;
  if (p.coverFit) imgStyle += ';object-fit:' + p.coverFit;
  if (p.coverScale) imgStyle += ';transform:scale(' + p.coverScale + ')';
  const bg = p.bg ? 'background:' + p.bg + ';' : '';
  return '<span class="' + bodyClass + '" style="width:' + size + 'px;height:' + size + 'px;' + bg + '--g-color:' + p.color + '">' +
    '<img class="globito-cover" src="' + p.image + '" alt="" style="' + imgStyle + '" />' +
    '</span>';
}

function getGlobitoLanes(w, bubbleSize) {
  const pad = 48;
  const minLane = Math.max(80, bubbleSize + 8);
  let centerW = Math.min(480, w * 0.5);
  let centerLeft = (w - centerW) / 2;
  let centerRight = centerLeft + centerW;
  const gap = 12;
  let leftMax = centerLeft - gap;
  let rightMin = centerRight + gap;
  while ((leftMax - pad < minLane || w - pad - rightMin < minLane) && centerW > w * 0.28) {
    centerW = Math.max(w * 0.28, centerW - 40);
    centerLeft = (w - centerW) / 2;
    centerRight = centerLeft + centerW;
    leftMax = centerLeft - gap;
    rightMin = centerRight + gap;
  }
  return {
    pad,
    left: { minX: pad, maxX: Math.max(pad, leftMax) },
    right: { minX: rightMin, maxX: w - pad }
  };
}

function clampGlobito(b, lanes, h) {
  const lane = lanes[b.side];
  const minX = lane.minX;
  const maxX = Math.max(minX, lane.maxX - b.size);
  b.x = Math.min(Math.max(b.x, minX), maxX);
  b.y = Math.min(Math.max(b.y, lanes.pad), h - lanes.pad - b.totalH);
}

function resolveGlobitoCollisions(bubbles, gap) {
  for (let i = 0; i < bubbles.length; i++) {
    for (let j = i + 1; j < bubbles.length; j++) {
      const a = bubbles[i];
      const b = bubbles[j];
      if (a.side !== b.side) continue;

      const ax = a.x + a.size * 0.5;
      const ay = a.y + a.size * 0.5;
      const bx = b.x + b.size * 0.5;
      const by = b.y + b.size * 0.5;
      let dx = bx - ax;
      let dy = by - ay;
      let dist = Math.hypot(dx, dy);
      const minDist = (a.size + b.size) * 0.5 + gap;

      if (dist >= minDist) continue;
      if (dist < 0.001) {
        dx = (Math.random() - 0.5) || 0.1;
        dy = (Math.random() - 0.5) || 0.1;
        dist = Math.hypot(dx, dy);
      }

      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = minDist - dist;
      const aMove = a.paused ? 0 : (b.paused ? 1 : 0.5);
      const bMove = b.paused ? 0 : (a.paused ? 1 : 0.5);

      if (!a.paused) {
        a.x -= nx * overlap * aMove;
        a.y -= ny * overlap * aMove;
      }
      if (!b.paused) {
        b.x += nx * overlap * bMove;
        b.y += ny * overlap * bMove;
      }

      if (!a.paused && !b.paused) {
        const relVx = a.vx - b.vx;
        const relVy = a.vy - b.vy;
        const dot = relVx * nx + relVy * ny;
        if (dot > 0) {
          a.vx -= dot * nx * 0.5;
          a.vy -= dot * ny * 0.5;
          b.vx += dot * nx * 0.5;
          b.vy += dot * ny * 0.5;
        }
      }
    }
  }
}

function initGlobitosDesktop() {
  const wrap = document.getElementById('globitos');
  if (!wrap || !PROJECTS.length) return;

  const captionH = 36;
  const maxSize = Math.max.apply(null, PROJECTS.map(p => p.size || 78));
  const lanes = getGlobitoLanes(window.innerWidth, maxSize);
  const viewH = window.innerHeight;
  const perSide = Math.ceil(PROJECTS.length / 2);
  const slotH = Math.max(100, (viewH - lanes.pad * 2 - maxSize - captionH) / Math.max(1, perSide - 0.5));

  const bubbles = PROJECTS.map((p, i) => {
    const size = p.size || 78;
    const totalH = size + captionH;
    const side = i % 2 === 0 ? 'left' : 'right';
    const lane = lanes[side];
    const laneW = Math.max(0, lane.maxX - lane.minX - size);
    const el = document.createElement('a');
    el.className = 'globito';
    el.href = p.url;
    el.setAttribute('aria-label', p.title);
    el.style.setProperty('--g-color', p.color);
    if (p.bg) el.style.setProperty('--g-bg', p.bg);
    el.style.width = Math.max(size, 92) + 'px';
    el.style.height = totalH + 'px';
    el.innerHTML =
      '<span class="globito-wrap">' +
        buildGlobitoBody(p, size) +
        '<span class="globito-caption">' + p.title + '</span>' +
      '</span>';
    wrap.appendChild(el);
    bindCursorHover([el]);

    const slot = Math.floor(i / 2);
    const angle = (Math.random() - 0.5) * Math.PI * 0.35 + (side === 'left' ? Math.PI : 0);
    const speed = 0.22 + Math.random() * 0.18;
    return {
      el,
      size,
      totalH,
      side,
      x: lane.minX + (laneW > 0 ? Math.random() * laneW : 0),
      y: lanes.pad + slot * slotH + Math.random() * Math.max(0, slotH - totalH - 8),
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      paused: false
    };
  });

  for (let n = 0; n < 16; n++) {
    resolveGlobitoCollisions(bubbles, 16);
    bubbles.forEach(b => clampGlobito(b, lanes, viewH));
  }

  bubbles.forEach(b => {
    b.el.addEventListener('mouseenter', () => { b.paused = true; });
    b.el.addEventListener('mouseleave', () => { b.paused = false; });
    b.el.addEventListener('focus', () => { b.paused = true; });
    b.el.addEventListener('blur', () => { b.paused = false; });
  });

  function animGlobitos() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const lanes = getGlobitoLanes(w, maxSize);
    bubbles.forEach(b => {
      const lane = lanes[b.side];
      const minX = lane.minX;
      const maxX = Math.max(minX, lane.maxX - b.size);
      if (!b.paused) {
        b.x += b.vx;
        b.y += b.vy;
        if (b.x <= minX) { b.x = minX; b.vx = Math.abs(b.vx); }
        if (b.x >= maxX) { b.x = maxX; b.vx = -Math.abs(b.vx); }
        if (b.y <= lanes.pad) { b.y = lanes.pad; b.vy = Math.abs(b.vy); }
        if (b.y + b.totalH >= h - lanes.pad) { b.y = h - lanes.pad - b.totalH; b.vy = -Math.abs(b.vy); }
      }
      clampGlobito(b, lanes, h);
    });
    resolveGlobitoCollisions(bubbles, 16);
    bubbles.forEach(b => clampGlobito(b, lanes, h));
    bubbles.forEach(b => {
      b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px)';
    });
    requestAnimationFrame(animGlobitos);
  }
  animGlobitos();

  requestAnimationFrame(() => {
    bubbles.forEach((b, i) => {
      setTimeout(() => b.el.classList.add('show'), i * 150);
    });
  });
}

function initGlobitosMobile() {

const subEl = document.getElementById('subline');
const formEl = document.getElementById('form-wrap');

function type() {

      subEl.style.opacity = '1';

/* CHAT GAME — TERMINAL */
const CHAT = {
  mucho: 'no podemos revelar detalles, pero involucra menos excel y más magia.',
  secreto: 'confidencial: estoy construyendo este sitio mientras construyo los de mis clientes. la arquitecta también necesita su propio sistema.',
  que: 'algo que hace que tu negocio funcione cuando vos no estás mirando. pronto.'
};

const CELLS = 14;
const BARS = [
  { id: 'cafe', pct: 96 },
  { id: 'codigo', pct: 58 },
  { id: 'paciencia', pct: 22 }
];

function renderBar(barEl, pctEl, filled, pct) {
  const empty = CELLS - filled;
  barEl.innerHTML =
    '<span class="fill">' + '█'.repeat(filled) + '</span>' +
    '<span class="track">' + '█'.repeat(empty) + '</span>';
  pctEl.textContent = pct + '%';
}

let barsStarted = false;
function startBars(onComplete) {
  if (barsStarted) return;
  barsStarted = true;
  let completed = 0;
  BARS.forEach((bar, i) => {
    const barEl = document.getElementById('bar-' + bar.id);
    const pctEl = document.getElementById('pct-' + bar.id);
    const target = Math.round(bar.pct / 100 * CELLS);
    let f = 0;
    renderBar(barEl, pctEl, 0, 0);
    setTimeout(() => {
      const iv = setInterval(() => {
        f++;
        renderBar(barEl, pctEl, f, Math.round(f / CELLS * 100));
        if (f >= target) {
          clearInterval(iv);
          renderBar(barEl, pctEl, target, bar.pct);
          completed++;
          if (completed === BARS.length && onComplete) onComplete();
        }
      }, 70);
    }, 250 + i * 350);
  });
}

const FACES = {
  que: 'assets/face-admiracion.svg',
  mucho: 'assets/face1.svg',
  secreto: 'assets/face-wink.svg'
};
let typeTimer = null;
function chatReply(k) {
  const el = document.getElementById('chat-resp');
  const wink = document.getElementById('chat-wink');
  clearTimeout(typeTimer);
  el.classList.remove('idle');
  wink.classList.remove('show');
  wink.src = FACES[k];
  const full = '> ' + CHAT[k];
  let i = 0;
  el.textContent = '';
  (function typeIt() {
    if (i <= full.length) {
      el.textContent = full.substring(0, i);
      i++;
      typeTimer = setTimeout(typeIt, 18);
    } else {
      wink.classList.add('show');
    }
  })();
}
document.querySelectorAll('.chat-btn').forEach(btn => {
  btn.addEventListener('click', () => chatReply(btn.dataset.chat));
});

/* SUCCESS — DINO */
const MSG = {
  ok: '¡Listo! Te aviso apenas esté.',
  already: '¡Ya estabas anotada! Te aviso igual.'
};
let successShown = false;
function showSuccess(message) {
  if (successShown) return;
  successShown = true;
  document.getElementById('form-wrap').style.display = 'none';
  const box = document.getElementById('success-msg');
  box.classList.add('show');
  const txt = document.getElementById('speech-text');
  let i = 0;
  setTimeout(function typeMsg() {
    txt.textContent = message.substring(0, i);
    if (i < message.length) {
      i++;
      setTimeout(typeMsg, 32);
    } else {
      const caret = document.createElement('span');
      caret.className = 'caret';
      box.querySelector('.speech').appendChild(caret);
    }
  }, 650);
}

/* FORM — guarda el email en Brevo vía /api/subscribe */
async function subscribe(email) {
  try {
    const r = await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.ok) return { status: 'error' };
    return { status: data.already ? 'already' : 'ok' };
  } catch (e) {
    // Sin conexión / entorno local sin serverless: no bloqueamos al usuario.
    return { status: 'ok' };
  }
}

const submitBtn = document.getElementById('submit-btn');
const errorEl = document.getElementById('form-error');

submitBtn.addEventListener('click', async () => {
  const input = document.getElementById('email-input');
  const val = input.value.trim();
  errorEl.classList.remove('show');
  if (!val || !val.includes('@')) {
    input.style.borderColor = 'var(--rose)';
    return;
  }
  submitBtn.disabled = true;
  const original = submitBtn.textContent;
  submitBtn.textContent = '···';

  const res = await subscribe(val);

  if (res.status === 'error') {
    submitBtn.disabled = false;
    submitBtn.textContent = original;
    errorEl.textContent = 'uy, algo falló. probá de nuevo en un rato.';
    errorEl.classList.add('show');
    return;
  }
  showSuccess(res.status === 'already' ? MSG.already : MSG.ok);
});

document.getElementById('email-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitBtn.click();
});
